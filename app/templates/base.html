<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aruba DHCP Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Aruba DHCP Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if active_page == 'pools' %}active{% endif %}" href="/pools">Pools DHCP</a></li>
        <li class="nav-item"><a class="nav-link {% if active_page == 'bindings' %}active{% endif %}" href="/bindings">Réservations</a></li>
      </ul>
      <span class="navbar-text">
        <select id="switch-picker" class="form-select form-select-sm d-inline-block w-auto"></select>
        <button id="btn-connect" type="button" class="btn btn-sm btn-outline-light">Se connecter</button>
        <button id="btn-disconnect" type="button" class="btn btn-sm btn-outline-danger d-none">Déconnecter</button>
      </span>
    </div>
  </div>
</nav>

<div class="container my-4">

  <div id="connection-banner" class="alert alert-warning d-flex justify-content-between align-items-center">
    <span id="connection-banner-text">Aucun switch connecté</span>
  </div>

  {% block content %}{% endblock %}

</div>

<!-- Modal : connexion switch -->
<div class="modal fade" id="modal-connect" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Se connecter à un switch</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-connect-error" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Switch</label>
          <select id="connect-switch-id" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="connect-username" class="form-control" autocomplete="off">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="connect-password" class="form-control" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" id="btn-connect-submit" class="btn btn-primary">Connecter</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const AVAILABLE_SWITCHES = {{ switches_json | safe }};
</script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
